services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: pipeline
      POSTGRES_PASSWORD: pipeline
      POSTGRES_DB: pipeline
    ports: ["5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro

  redis:
    image: redis:7
    ports: ["6379:6379"]

  localstack:
    image: localstack/localstack:3.8
    environment:
      SERVICES: s3,sqs
    ports: ["4566:4566"]
    volumes:
      - ./infra/localstack-init.sh:/etc/localstack/init/ready.d/init.sh:ro

  api:
    build: ./backend
    ports: ["8000:8000"]
    environment: &aws_env
      DATABASE_URL: postgresql://pipeline:pipeline@postgres:5432/pipeline
      REDIS_URL: redis://redis:6379/0
      AWS_ENDPOINT_URL: http://localstack:4566
      AWS_REGION: us-east-1
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      JOBS_QUEUE_URL: http://localstack:4566/000000000000/pipeline-jobs
    depends_on: [postgres, redis, localstack]

  worker:
    build: ./worker
    environment: *aws_env
    depends_on: [postgres, localstack]

volumes:
  pgdata:
